name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep bubblewrap
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Verify trusted bubblewrap
        run: |
          command -v bwrap
          readlink -f "$(command -v bwrap)"
          test "$(readlink -f "$(command -v bwrap)")" = /usr/bin/bwrap
          bwrap --version

      - name: Install trusted Node for isolation smoke
        run: |
          sudo install -m 0755 "$(command -v node)" /usr/bin/node
          test "$(readlink -f /usr/bin/node)" = /usr/bin/node
          cmp "$(command -v node)" /usr/bin/node
          /usr/bin/node --version

      # Ubuntu 24.04 AppArmor otherwise denies bubblewrap's unprivileged UID map on this ephemeral runner.
      # This enables the real isolation tests; Tau still refuses to run without its sandbox boundary.
      - name: Enable user namespaces for isolation tests
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Restore runner user namespace restriction
        if: always()
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1

  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runs pi's MCP client from source against the pinned official conformance suite and fails on
      # regressions against packages/coding-agent/test/mcp-conformance/baseline.json.
      - name: MCP client conformance
        run: npm run test:mcp-conformance
